# shellcheck shell=bash
# =====================================================================
# Configuración de la copia automática al USB cifrado (LUKS2 + ext4).
# Se instala en /etc/respaldo-usb.conf (root:root, 644). La leen:
#   - respaldo-usb.sh (como root, lanzado por systemd al conectar el USB)
#   - comprobar-usb.sh y backup.sh (como tu usuario, para el aviso de 8 días)
# No contiene secretos: la frase y el archivo-llave NO van aquí.
# Tras cambiarla, vuelve a instalarla (ver README.md, paso e).
# =====================================================================

# Tu usuario: dueño de los respaldos, del log y de la marca, y a quien se
# envía el aviso de escritorio. Es el ÚNICO sitio donde está escrito.
USUARIO="cristian-miguel-cristobal-blas"

# UUID de la partición LUKS del USB (README.md, paso d). Identifica ESTE USB,
# no cualquier /dev/sdX. Mientras siga el valor de ejemplo, no hace nada.
UUID_LUKS="00000000-0000-0000-0000-000000000000"

# Archivo-llave (ranura LUKS para la copia automática). Solo en el servidor,
# root:root 400. El script nunca lo lee ni lo muestra: solo pasa la ruta a
# cryptsetup.
ARCHIVO_LLAVE="/root/.respaldo-usb.key"

# Nombre del dispositivo descifrado (/dev/mapper/…) y punto de montaje fijo.
NOMBRE_MAPPER="respaldo-usb"
PUNTO_MONTAJE="/mnt/respaldo-usb"

# Origen: lo que genera scripts/backup/backup.sh.
ORIGEN="/home/${USUARIO}/backups/electrosac"

# Carpeta dentro del USB; cada copia va a <CARPETA_USB>/AAAA-MM-DD_HHMMSS/.
CARPETA_USB="respaldos-electrosac"

# Retención en el USB: ventana móvil de las N copias más recientes. La más
# antigua se borra SOLO después de verificar la nueva.
COPIAS_A_CONSERVAR=5

# No se copia si, después de copiar, el espacio libre quedaría por debajo de
# este porcentaje del tamaño del USB.
MIN_LIBRE_PCT=10

# comprobar-usb.sh avisa cuando la última copia correcta tiene más de N días.
DIAS_AVISO=8

# Log y marca de la última copia correcta, legibles por tu usuario.
LOG_USB="${ORIGEN}/usb.log"
MARCA="${ORIGEN}/USB_ULTIMA_COPIA"

# Bloqueo para que no corran dos copias a la vez.
RUTA_LOCK="/run/lock/respaldo-usb.lock"

# Avisos al terminar (1 = sí, 0 = no):
#   AVISO_ESCRITORIO: notify-send y sonido en tu sesión gráfica, si la hay.
#   AVISO_LED: hace parpadear estos LED (el de Bloq Mayús funciona aunque la
#              pantalla esté apagada o no haya nadie conectado; admite
#              comodines: todos los teclados). Vacío = no.
#              Lento = copia correcta, rápido = error.
AVISO_ESCRITORIO=1
AVISO_LED="/sys/class/leds/input*::capslock"
